name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Reuse thumbnails from previous runs; build-gallery.mjs only reprocesses
      # images whose content hash changed, and prunes ones that were deleted.
      - name: Restore generated gallery images
        uses: actions/cache@v4
        with:
          path: public/media
          key: gallery-${{ hashFiles('gallery/**', 'scripts/build-gallery.mjs') }}
          restore-keys: gallery-

      # prebuild runs scripts/build-gallery.mjs
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
